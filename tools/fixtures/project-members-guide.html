<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Members</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; padding: 1.5rem; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .shadow-soft { box-shadow: 0 0.5rem 1rem rgba(0,0,0,.08)!important; }
    .guide-note { display: none; }
  </style>
</head>
<body>
  <div class="container-fluid" style="max-width: 1200px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h4 mb-0">Members: Website Redesign (PRJ-WEB-03)</h1>
        <div class="text-muted small">Project ID: 3</div>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-secondary btn-sm" href="#">Back to Project</a>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-lg-7">
        <div class="card shadow-soft h-100">
          <div class="card-body">
            <h2 class="h6">Current Members</h2>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>User</th>
                    <th>Role</th>
                    <th style="width:220px">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <div class="fw-semibold">manager@example.com</div>
                      <div class="text-muted small">Project Manager</div>
                    </td>
                    <td><span class="badge bg-light text-dark border">Manager</span></td>
                    <td>
                      <div class="d-flex gap-2">
                        <select class="form-select form-select-sm" style="max-width:110px">
                          <option selected>Manager</option>
                          <option>Lead</option>
                          <option>Developer</option>
                        </select>
                        <button class="btn btn-outline-primary btn-sm">Update</button>
                        <button class="btn btn-outline-danger btn-sm">Remove</button>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <div class="fw-semibold">lead@example.com</div>
                      <div class="text-muted small">Team Lead</div>
                    </td>
                    <td><span class="badge bg-light text-dark border">Lead</span></td>
                    <td>
                      <div class="d-flex gap-2">
                        <select class="form-select form-select-sm" style="max-width:110px">
                          <option>Manager</option>
                          <option selected>Lead</option>
                          <option>Developer</option>
                        </select>
                        <button class="btn btn-outline-primary btn-sm">Update</button>
                        <button class="btn btn-outline-danger btn-sm">Remove</button>
                      </div>
                    </td>
                  </tr>
                  <tr>
                    <td>
                      <div class="fw-semibold">employee1@example.com</div>
                      <div class="text-muted small">Employee One</div>
                    </td>
                    <td><span class="badge bg-light text-dark border">Developer</span></td>
                    <td>
                      <div class="d-flex gap-2">
                        <select class="form-select form-select-sm" style="max-width:110px">
                          <option>Lead</option>
                          <option selected>Developer</option>
                          <option>Tester</option>
                        </select>
                        <button class="btn btn-outline-primary btn-sm">Update</button>
                        <button class="btn btn-outline-danger btn-sm">Remove</button>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
      <div class="col-lg-5">
        <div class="card shadow-soft h-100">
          <div class="card-body">
            <h2 class="h6">Add Member</h2>
            <form class="d-flex gap-2 mb-3">
              <input type="text" class="form-control" value="employee" placeholder="Search users by email or name" />
              <button class="btn btn-outline-secondary" type="button">Search</button>
            </form>
            <div class="table-responsive">
              <table class="table table-sm align-middle">
                <thead>
                  <tr>
                    <th>User</th>
                    <th style="width:180px">Role</th>
                    <th style="width:120px"></th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>
                      <div class="fw-semibold">employee2@example.com</div>
                      <div class="text-muted small">Employee Two</div>
                    </td>
                    <td>
                      <div class="d-flex gap-2">
                        <select class="form-select form-select-sm">
                          <option>Manager</option>
                          <option>Lead</option>
                          <option>Developer</option>
                          <option>Tester</option>
                          <option>Viewer</option>
                          <option selected>Member</option>
                        </select>
                        <button class="btn btn-primary btn-sm" type="button">Add</button>
                      </div>
                    </td>
                    <td></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
